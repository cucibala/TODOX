<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TodoX - 任务清单</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- 头部 -->
    <header class="header">
      <div class="header-content">
        <h1 class="app-title">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
          TodoX
        </h1>
        <div class="header-stats">
          <span class="stat-item">
            <span class="stat-label">总计:</span>
            <span class="stat-value" id="total-count">0</span>
          </span>
          <span class="stat-item">
            <span class="stat-label">已完成:</span>
            <span class="stat-value" id="completed-count">0</span>
          </span>
        </div>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 侧边栏 -->
      <aside class="sidebar">
        <div class="filter-section">
          <h3 class="section-title">筛选</h3>
          <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              </svg>
              全部任务
            </button>
            <button class="filter-btn" data-filter="active">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
              </svg>
              未完成
            </button>
            <button class="filter-btn" data-filter="completed">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
              </svg>
              已完成
            </button>
          </div>
        </div>

        <div class="priority-section">
          <h3 class="section-title">优先级</h3>
          <div class="filter-buttons">
            <button class="priority-filter-btn" data-priority="all">全部</button>
            <button class="priority-filter-btn priority-high" data-priority="high">高</button>
            <button class="priority-filter-btn priority-medium" data-priority="medium">中</button>
            <button class="priority-filter-btn priority-low" data-priority="low">低</button>
          </div>
        </div>
      </aside>

      <!-- 任务列表区域 -->
      <section class="content-area">
        <!-- 搜索和添加栏 -->
        <div class="toolbar">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" id="search-input" placeholder="搜索任务..." />
          </div>
        </div>

        <!-- 添加任务表单 -->
        <div class="add-task-section">
          <form id="add-task-form">
            <div class="input-group">
              <input 
                type="text" 
                id="task-input" 
                placeholder="添加新任务..." 
                autocomplete="off"
                required
              />
              <input 
                type="date" 
                id="due-date-input" 
                class="date-input"
                title="截止日期（默认今天）"
              />
              <select id="priority-select" class="priority-select">
                <option value="low">低优先级</option>
                <option value="medium" selected>中优先级</option>
                <option value="high">高优先级</option>
              </select>
              <button type="button" class="btn-image" id="add-image-btn" title="添加图片">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <circle cx="8.5" cy="8.5" r="1.5"></circle>
                  <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
              </button>
              <button type="submit" class="btn-add">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                添加
              </button>
            </div>
            <div id="image-preview-container" class="image-preview-container" style="display: none;">
              <div class="image-preview-wrapper">
                <img id="image-preview" class="image-preview" />
                <button type="button" class="btn-remove-image" id="remove-image-btn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                  </svg>
                </button>
              </div>
            </div>
          </form>
        </div>

        <!-- 任务列表 -->
        <div class="task-list-container">
          <div id="task-list" class="task-list">
            <!-- 任务项将动态添加到这里 -->
          </div>
          <div id="empty-state" class="empty-state">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
            <p>暂无任务</p>
            <span>添加一个新任务开始吧!</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
