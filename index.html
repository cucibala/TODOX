<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TodoX - 任务清单</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- 自定义标题栏 -->
    <div class="titlebar">
      <div class="titlebar-drag-region">
        <div class="titlebar-title">
          <svg class="titlebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
          <span>TodoX</span>
        </div>
      </div>
      <div class="titlebar-controls">
        <button class="titlebar-btn" id="btn-lock" title="锁定程序">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </button>
        <button class="titlebar-btn" id="btn-desktop" title="桌面背景模式">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </button>
        <button class="titlebar-btn" id="btn-pin" title="窗口置顶">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="17" x2="12" y2="22"></line>
            <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path>
          </svg>
        </button>
        <button class="titlebar-btn" id="btn-compact" title="切换迷你模式">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
        <button class="titlebar-btn" id="btn-minimize" title="最小化">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button class="titlebar-btn titlebar-btn-close" id="btn-close" title="隐藏到托盘">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- 头部统计 -->
    <header class="header">
      <div class="header-content">
        <div class="header-stats">
          <span class="stat-item">
            <span class="stat-label">总计:</span>
            <span class="stat-value" id="total-count">0</span>
          </span>
          <span class="stat-item">
            <span class="stat-label">已完成:</span>
            <span class="stat-value" id="completed-count">0</span>
          </span>
        </div>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 侧边栏 -->
      <aside class="sidebar">
        <!-- 项目管理部分 -->
        <div class="project-section">
          <div class="section-header">
            <h3 class="section-title">项目</h3>
            <button class="btn-add-project" id="btn-add-project" title="创建项目">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </div>
          <div id="project-list" class="project-list">
            <!-- 项目列表将动态生成 -->
          </div>
        </div>

        <div class="filter-section">
          <h3 class="section-title">筛选</h3>
          <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              </svg>
              全部任务
            </button>
            <button class="filter-btn" data-filter="active">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
              </svg>
              未完成
            </button>
            <button class="filter-btn" data-filter="completed">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
              </svg>
              已完成
            </button>
          </div>
        </div>

        <div class="priority-section">
          <h3 class="section-title">优先级</h3>
          <div class="filter-buttons">
            <button class="priority-filter-btn" data-priority="all">全部</button>
            <button class="priority-filter-btn priority-high" data-priority="high">高</button>
            <button class="priority-filter-btn priority-medium" data-priority="medium">中</button>
            <button class="priority-filter-btn priority-low" data-priority="low">低</button>
          </div>
        </div>

        <div class="settings-section">
          <h3 class="section-title">设置</h3>
          <div class="settings-buttons">
            <button class="settings-btn" id="btn-data-path-settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
              数据存储路径
            </button>
          </div>
        </div>
      </aside>

      <!-- 任务列表区域 -->
      <section class="content-area">
        <!-- 搜索和添加栏 -->
        <div class="toolbar">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" id="search-input" placeholder="搜索任务..." />
          </div>
        </div>

        <!-- 添加任务表单 -->
        <div class="add-task-section">
          <div id="no-project-hint" class="no-project-hint" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>请先创建一个项目，然后再添加任务</span>
          </div>
          <div id="current-project-display" class="current-project-display" style="display: none;">
            <span class="current-project-label">当前项目：</span>
            <span class="current-project-name" id="current-project-name"></span>
          </div>
          <form id="add-task-form">
            <div class="input-group">
              <input 
                type="text" 
                id="task-input" 
                placeholder="添加新任务..." 
                autocomplete="off"
                required
              />
              <input 
                type="date" 
                id="due-date-input" 
                class="date-input"
                title="截止日期（可选）"
              />
              <select id="priority-select" class="priority-select">
                <option value="low">低优先级</option>
                <option value="medium" selected>中优先级</option>
                <option value="high">高优先级</option>
              </select>
              <button type="button" class="btn-image" id="add-image-btn" title="添加图片（可添加多张）">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <circle cx="8.5" cy="8.5" r="1.5"></circle>
                  <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
              </button>
              <button type="submit" class="btn-add">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                添加
              </button>
            </div>
            <div id="image-preview-container" class="image-preview-container" style="display: none;">
              <!-- 图片预览将动态添加到这里 -->
            </div>
          </form>
        </div>

        <!-- 任务列表 -->
        <div class="task-list-container">
          <div id="task-list" class="task-list">
            <!-- 任务项将动态添加到这里 -->
          </div>
          <div id="empty-state" class="empty-state">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
            <p>暂无任务</p>
            <span>添加一个新任务开始吧!</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 锁定界面 -->
  <div id="lock-screen" class="lock-screen" style="display: none;">
    <div class="lock-content">
      <div class="lock-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2 class="lock-title">TodoX 已锁定</h2>
      <p class="lock-subtitle">请输入密码解锁</p>
      <form id="unlock-form" class="lock-form">
        <input 
          type="password" 
          id="unlock-password-input" 
          class="lock-input" 
          placeholder="输入密码" 
          autocomplete="off"
          required
        />
        <div class="lock-error" id="unlock-error" style="display: none;"></div>
        <button type="submit" class="lock-btn">解锁</button>
      </form>
      <div class="lock-footer">
        <button type="button" class="lock-link" id="btn-set-password">设置/修改密码</button>
      </div>
    </div>
  </div>

  <!-- 添加子任务弹窗 -->
  <div class="subtask-dialog" id="subtask-dialog" style="display: none;">
    <div class="subtask-dialog-overlay"></div>
    <div class="subtask-dialog-content">
      <div class="subtask-dialog-header">
        <h3 class="subtask-dialog-title">添加子任务</h3>
        <button class="subtask-dialog-close" id="subtask-dialog-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="subtask-dialog-body">
        <div class="subtask-form-group">
          <label class="subtask-label">子任务内容</label>
          <input type="text" class="subtask-dialog-input" id="subtask-dialog-input" placeholder="输入子任务内容..." />
        </div>
        <div class="subtask-form-group">
          <label class="subtask-label">重要程度</label>
          <div class="subtask-priority-options">
            <label class="subtask-priority-option">
              <input type="radio" name="subtask-priority" value="5" />
              <span class="priority-badge priority-high">高</span>
            </label>
            <label class="subtask-priority-option">
              <input type="radio" name="subtask-priority" value="3" checked />
              <span class="priority-badge priority-medium">中</span>
            </label>
            <label class="subtask-priority-option">
              <input type="radio" name="subtask-priority" value="2" />
              <span class="priority-badge priority-low">低</span>
            </label>
          </div>
        </div>
      </div>
      <div class="subtask-dialog-footer">
        <button class="subtask-dialog-btn subtask-dialog-btn-cancel" id="subtask-dialog-cancel">取消</button>
        <button class="subtask-dialog-btn subtask-dialog-btn-confirm" id="subtask-dialog-confirm">添加</button>
      </div>
    </div>
  </div>

  <!-- 数据路径设置弹窗 -->
  <div class="data-path-dialog" id="data-path-dialog" style="display: none;">
    <div class="data-path-dialog-overlay"></div>
    <div class="data-path-dialog-content">
      <div class="data-path-dialog-header">
        <h3 class="data-path-dialog-title">数据存储路径设置</h3>
        <button class="data-path-dialog-close" id="data-path-dialog-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="data-path-dialog-body">
        <div class="data-path-info">
          <div class="data-path-label">当前存储路径：</div>
          <div class="data-path-current" id="data-path-current">加载中...</div>
        </div>
        <div class="data-path-hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>更改路径后会自动迁移所有数据（任务、项目、图片等）</span>
        </div>
      </div>
      <div class="data-path-dialog-footer">
        <button class="data-path-dialog-btn data-path-dialog-btn-reset" id="data-path-btn-reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
            <path d="M21 3v5h-5"></path>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
            <path d="M3 21v-5h5"></path>
          </svg>
          重置为默认
        </button>
        <button class="data-path-dialog-btn data-path-dialog-btn-select" id="data-path-btn-select">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          选择新路径
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
