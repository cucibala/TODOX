<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TodoX 组织项目管理</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f5f7fb;
        min-height: 100vh;
        color: #1f2937;
      }
      header {
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .nav {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .nav a {
        text-decoration: none;
        font-size: 12px;
        color: #6b7280;
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid transparent;
      }
      .nav a.active {
        color: #1f2937;
        background: #f3f4f6;
        border-color: #e5e7eb;
        font-weight: 600;
      }
      header .title {
        font-size: 18px;
        font-weight: 700;
      }
      header .user {
        font-size: 13px;
        color: #6b7280;
      }
      header button {
        border: 1px solid #e5e7eb;
        background: #ffffff;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .container {
        max-width: 960px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 16px 32px rgba(31, 41, 55, 0.1);
        padding: 20px 24px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .toolbar .left {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .toolbar label {
        font-size: 12px;
        color: #6b7280;
      }
      .toolbar select {
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid #e5e7eb;
        font-size: 13px;
        outline: none;
        min-width: 220px;
      }
      .count {
        font-size: 12px;
        color: #6b7280;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th, td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid #e5e7eb;
      }
      th {
        font-size: 12px;
        color: #6b7280;
        font-weight: 600;
      }
      .muted {
        color: #9ca3af;
      }
      .message {
        font-size: 12px;
        color: #dc2626;
        margin-top: 10px;
      }
      .empty {
        text-align: center;
        color: #9ca3af;
        font-size: 13px;
        padding: 24px 0;
      }
      @media (max-width: 720px) {
        .toolbar {
          flex-direction: column;
          align-items: flex-start;
        }
        table {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="title">组织项目管理</div>
        <div class="user" id="admin-user"></div>
      </div>
      <div class="header-right">
        <nav class="nav">
          <a href="/admin/orgs">组织管理</a>
          <a class="active" href="/admin/projects">组织项目</a>
          <a href="/admin/members">组织成员</a>
        </nav>
        <button id="logout-btn" type="button">退出登录</button>
      </div>
    </header>

    <div class="container">
      <div class="card">
        <div class="toolbar">
          <div class="left">
            <label for="org-select">选择组织</label>
            <select id="org-select"></select>
          </div>
          <div class="count" id="project-count"></div>
        </div>
        <div id="message" class="message"></div>
        <div id="table-wrapper"></div>
      </div>
    </div>

    <script>
      const adminUserEl = document.getElementById('admin-user');
      const logoutBtn = document.getElementById('logout-btn');
      const orgSelect = document.getElementById('org-select');
      const messageEl = document.getElementById('message');
      const tableWrapper = document.getElementById('table-wrapper');
      const countEl = document.getElementById('project-count');

      function setMessage(text) {
        messageEl.textContent = text || '';
      }

      function setCount(count) {
        countEl.textContent = Number.isFinite(count) ? `共 ${count} 个项目` : '';
      }

      function renderTable(items) {
        if (!items || items.length === 0) {
          tableWrapper.innerHTML = '<div class="empty">暂无项目数据</div>';
          setCount(0);
          return;
        }
        setCount(items.length);
        const rows = items.map(item => `
          <tr>
            <td>${item.id || '-'}</td>
            <td>${item.name || '-'}</td>
            <td>${item.priority || '-'}</td>
            <td>${item.groupId || '<span class="muted">未分组</span>'}</td>
            <td>${item.updatedAt || '-'}</td>
          </tr>
        `).join('');
        tableWrapper.innerHTML = `
          <table>
            <thead>
              <tr>
                <th style="width: 22%;">项目 ID</th>
                <th>项目名称</th>
                <th style="width: 12%;">优先级</th>
                <th style="width: 18%;">分组</th>
                <th style="width: 18%;">更新时间</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }

      async function checkSession() {
        const response = await fetch('/api/admin/session');
        if (!response.ok) {
          window.location.href = '/admin/login';
          return;
        }
        const data = await response.json();
        if (!data.loggedIn) {
          window.location.href = '/admin/login';
          return;
        }
        adminUserEl.textContent = data.username ? `管理员：${data.username}` : '';
      }

      async function loadOrganizations() {
        const response = await fetch('/api/admin/orgs');
        if (!response.ok) {
          setMessage('无法加载组织列表');
          return [];
        }
        return response.json();
      }

      function renderOrgOptions(orgs) {
        orgSelect.innerHTML = '';
        if (!orgs || orgs.length === 0) {
          const option = document.createElement('option');
          option.value = '';
          option.textContent = '暂无组织';
          orgSelect.appendChild(option);
          orgSelect.disabled = true;
          return;
        }
        orgSelect.disabled = false;
        orgs.forEach(org => {
          const option = document.createElement('option');
          option.value = org.id;
          option.textContent = `${org.name}（${org.account}）`;
          orgSelect.appendChild(option);
        });
      }

      async function loadProjects(orgId) {
        if (!orgId) {
          renderTable([]);
          return;
        }
        setMessage('');
        try {
          const response = await fetch(`/api/admin/orgs/${orgId}/projects`);
          if (!response.ok) {
            setMessage('无法加载项目列表');
            renderTable([]);
            return;
          }
          const data = await response.json();
          renderTable(data);
        } catch (error) {
          setMessage('无法连接服务端');
          renderTable([]);
        }
      }

      logoutBtn.addEventListener('click', async () => {
        await fetch('/api/admin/logout', { method: 'POST' });
        window.location.href = '/admin/login';
      });

      orgSelect.addEventListener('change', () => {
        loadProjects(orgSelect.value);
      });

      async function init() {
        await checkSession();
        const orgs = await loadOrganizations();
        renderOrgOptions(orgs);
        if (orgs && orgs.length > 0) {
          orgSelect.value = orgs[0].id;
          loadProjects(orgs[0].id);
        } else {
          renderTable([]);
        }
      }

      init().catch(() => {
        window.location.href = '/admin/login';
      });
    </script>
  </body>
</html>
